spring.application.name=finance-goal

# 預設啟用 local profile，帳密放在 application-local.properties（不進 git）
spring.profiles.active=local

# ===== 伺服器 =====
# 沒有登入功能，所以只允許本機連線
server.address=127.0.0.1
# 避開 Java_website 用的 8080
server.port=8081
server.servlet.session.tracking-modes=cookie

# ===== 資料庫 =====
spring.datasource.url=jdbc:mysql://localhost:3306/finance_goal?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Taipei
spring.datasource.username=${DB_USERNAME:app_user}
spring.datasource.password=${DB_PASSWORD:}

# ===== Flyway：資料表一律由 db/migration/V*.sql 建立 =====
spring.flyway.enabled=true

# ===== JPA =====
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jackson.time-zone=Asia/Taipei

# ===== Thymeleaf =====
spring.thymeleaf.cache=false

# ===== 台股股價：交易日 14:45、17:30 各抓一次收盤價 =====
finance.stocks.price-cron=0 45 14 * * MON-FRI
finance.stocks.price-cron-evening=0 30 17 * * MON-FRI

# ===== 淨資產快照：每天 23:55 更新本月快照（月底那天的值就是當月結果）=====
finance.snapshot.cron=0 55 23 * * *
